<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Budget Tracker</h1><button id="reset" class="ghost">Reset</button></header>

<main>
<section id="dashboard" class="screen active">
  <div class="hero card"><span>Safe to spend</span><strong id="safe">$0.00</strong><small id="safeNote">Add a paycheck and bills to begin.</small></div>
  <div class="grid">
    <div class="stat card"><span>Balance</span><b id="balance">$0.00</b></div>
    <div class="stat card"><span>Next paycheck</span><b id="nextPay">$0.00</b></div>
    <div class="stat card"><span>Bills</span><b id="billTotal">$0.00</b></div>
    <div class="stat card"><span>Debt</span><b id="debtTotal">$0.00</b></div>
  </div>
  <div class="card"><h2>Quick add</h2>
    <div class="actions"><button onclick="openForm('paycheck')">+ Paycheck</button><button onclick="openForm('bill')">+ Bill</button><button onclick="openForm('spending')">+ Spending</button><button onclick="openForm('debt')">+ Debt</button></div>
  </div>
  <div class="card"><h2>Recent spending</h2><div id="recent"></div></div>
</section>

<section id="paychecks" class="screen"><div class="sectionHead"><h2>Paychecks</h2><button onclick="openForm('paycheck')">+ Add</button></div><div id="paycheckList"></div></section>
<section id="bills" class="screen"><div class="sectionHead"><h2>Bills</h2><button onclick="openForm('bill')">+ Add</button></div><div id="billList"></div></section>
<section id="spending" class="screen"><div class="sectionHead"><h2>Spending</h2><button onclick="openForm('spending')">+ Add</button></div><div id="spendingList"></div></section>
<section id="debt" class="screen"><div class="sectionHead"><h2>Debt</h2><button onclick="openForm('debt')">+ Add</button></div><div id="debtList"></div></section>
<section id="goals" class="screen"><div class="sectionHead"><h2>Savings goals</h2><button onclick="openForm('goal')">+ Add</button></div><div id="goalList"></div></section>
</main>

<nav>
<button data-screen="dashboard">⌂<small>Home</small></button>
<button data-screen="paychecks">💵<small>Paychecks</small></button>
<button data-screen="bills">🧾<small>Bills</small></button>
<button data-screen="spending">🛒<small>Spending</small></button>
<button data-screen="debt">💳<small>Debt</small></button>
<button data-screen="goals">🎯<small>Goals</small></button>
</nav>

<div id="modal" class="modal hidden"><div class="modalBox"><div class="sectionHead"><h2 id="formTitle">Add</h2><button onclick="closeForm()">✕</button></div><form id="form"></form></div></div>
<script src="app.js"></script>
</body></html>
